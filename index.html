<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sw.css">
</head>
<body>

    <section class="stopwatch-page">

        <div class="stopwatch-card">

            <h1 class="app-title">ChronoTrack</h1>
            <p class="subtitle">Precision Time Tracking</p>

            <div class="time-display" id="display">
                00:00:00
            </div>

            <div class="button-group">
                <button class="start-btn" id="startBtn">Start</button>
                <button class="pause-btn" id="pauseBtn">Pause</button>
                <button class="reset-btn" id="resetBtn">Reset</button>
                <button class="lap-btn" id="lapBtn">Lap</button>
            </div>

            <div id="lapList"></div>

            <p class="footer-text">Built by Neha</p>

        </div>

    </section>

    <script src="sw.js"></script>
</body>
</html>
